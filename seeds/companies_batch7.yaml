# seeds/companies_batch7.yaml -- JS-rendered careers sites, resolved 2026-10-16.
#
# Each careers page was loaded in headless Chromium (Playwright) and its
# XHR/fetch calls and apply links recorded. Counts are India / Bengaluru on
# the day. Oracle and Atlassian sit at priority 2: Oracle makes one detail
# call per posting, and Atlassian's one response is the whole world (~350).

- {name: PromptQL (Hasura), ats: gem,       token: promptql,                    category: product, priority: 2}   # india=1, blr=1; promptql.io/careers -> jobs.gem.com/promptql
- {name: Oracle,            ats: oracle,    token: "eeho.fa.us2|CX_45001|India", category: gcc,     priority: 2}   # india=14, blr=6; careers.oracle.com loads hcmRestApi on eeho.fa.us2; CX_1 serves the same data
- {name: Atlassian,         ats: atlassian, token: atlassian,                   category: product, priority: 2}   # india=54, blr=47; all-jobs page renders /endpoint/careers/listings (iCIMS apply links)

# Replacements for two boards that died by themselves (seeds/companies_retired.yaml, moved).
- {name: Postman,             ats: workday, token: "postman|wd108|careers",                    category: product, priority: 2}   # india=9, blr=9
- {name: Palo Alto Networks,  ats: workday, token: "paloaltonetworks|wd5|panwexternalcareers", category: product, priority: 2}   # india=144, blr=111; absorbed Chronosphere

# Avature (HTML portal). The search keyword is Bengaluru's spelling on this portal;
# see ingest/adapters/avature.py for why it is the city and not India (855 roles).
- {name: Siemens, ats: avature, token: "jobs.siemens.com/en_US/externaljobs|Bangalore", category: gcc, priority: 3}   # 178 listed, 162 Bengaluru; ~4.7 min a fetch (portal throttles), so daily

# Societe Generale's own careers search (Sinequa); apply links go to socgen.taleo.net.
- {name: Societe Generale, ats: socgen, token: Bangalore, category: gcc, priority: 2}   # 224 listed, 210 Bengaluru; 5 s a fetch
