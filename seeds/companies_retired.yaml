# seeds/companies_retired.yaml — boards deactivated, and why.
#
# Found 2026-10-15: 7 of 124 active boards had never produced a single job
# since they were added. None ever alerted, because the empty-fetch guard only
# fires when there are stored rows to protect -- a board that never returned
# anything looks exactly like a healthy quiet one. Each was fetched unfiltered
# to tell the cases apart. scripts/audit_roster.py now runs daily to catch the
# next one.
#
# Deactivated (companies.active = false), not deleted: a corrected token can be
# added as a new row, and these rows keep the history of what was tried.

dead_token:          # the board answers with zero postings at all
  - {name: Freshworks, ats: lever, token: freshworks,
     note: "moved to SmartRecruiters (company id Freshworks, 37 India postings); re-added there"}
  - {name: Plivo, ats: lever, token: plivo}

wrong_company:       # the token resolves to a different employer with the same name
  - {name: Navi, ats: ashby, token: navi,
     note: "4 postings, all San Francisco -- not Navi (Bengaluru fintech)"}
  - {name: Porter, ats: lever, token: porter,
     note: "26 postings in Amherst MA, Boston, Grand Rapids -- not Porter (Indian logistics)"}
  - {name: Slice, ats: greenhouse, token: slice,
     note: "27 postings in New Jersey, Philadelphia, Skopje -- not slice (Indian fintech)"}

no_india_headcount:  # right company, live board, never an India posting
  - {name: Cribl, ats: greenhouse, token: cribl, note: "66 postings, none in India"}
  - {name: Included Health, ats: lever, token: includedhealth, note: "50 postings, all US"}
  # 2026-10-16, from the daily roster audit (scripts/audit_roster.py):
  - {name: Hightouch, ats: ashby, token: hightouch, note: "1 posting, Remote (US); no India role ever"}
  - {name: Neon, ats: ashby, token: neon, note: "4 postings: New York, San Francisco, Remote; no India role ever"}
  - {name: Deepgram, ats: ashby, token: deepgram, note: "88 postings, 80 Remote (US), none naming India"}
  - {name: Socket, ats: ashby, token: socket, note: "28 postings, Remote (US) and San Francisco; no India role ever"}

moved:               # the employer left this board; the replacement is in batch 7
  - {name: Postman, ats: greenhouse, token: postman,
     note: "2026-10-16: careers page now links postman.wd108.myworkdayjobs.com/careers (Workday)"}
  - {name: Chronosphere, ats: ashby, token: chronospherejobs,
     note: "2026-10-16: acquired by Palo Alto Networks; chronosphere.io/careers redirects to jobs.paloaltonetworks.com (Workday wd5, panwexternalcareers)"}
