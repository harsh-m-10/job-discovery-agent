# seeds/companies_workday.yaml
#
# Workday tokens are compound: "tenant|wdHost|site". All three parts are
# per-tenant and published nowhere, so each was resolved with
# scripts/find_workday.py and its identity confirmed from a sample posting.
#
# Discovery notes, so nobody repeats the dead ends:
#   * 404 from the CXS endpoint = tenant real, site name wrong.
#     422 = tenant not on that wd host. A nonsense tenant returns 422 on every
#     host, so 422 is not evidence of anything.
#   * A non-browser User-Agent is rejected outright by the bot filter.
#   * Site names are case-insensitive (targetCareers == TargetCareers).
#
# Unresolved from the requested seed list:
#   Walmart   — tenant exists on wd5, site name not guessable. Needs the manual
#               lookup: open the careers page and read it out of the URL.
#   JPMorgan, Nutanix, Zscaler, Arista, Juniper — no Workday tenant found under
#               any slug tried. They are on another ATS or a bespoke portal.

- {name: Cisco,  ats: workday, token: "cisco|wd5|cisco_Careers",   category: gcc, priority: 2}
- {name: Target, ats: workday, token: "target|wd5|targetCareers",  category: gcc, priority: 2}
- {name: Adobe,  ats: workday, token: "adobe|wd5|external_experienced", category: gcc, priority: 2}

# --- Added 2026-09-04. Both were previously recorded dead as lever/<name>;
# their careers pages load Workday, and find_workday.py resolved the tenants.
# Identity confirmed from a sample posting, as above.
- {name: Sprinklr,     ats: workday, token: "sprinklr|wd1|Careers",     category: product, priority: 2}   # 92 jobs
- {name: BrowserStack, ats: workday, token: "browserstack|wd3|External", category: product, priority: 2}   # 30 jobs

# --- Added 2026-09-05. Tenants resolved with find_workday.py, then the India
# count confirmed by running the adapter itself rather than trusting the raw
# board size — the adapter applies a country facet, so board total and useful
# total differ by orders of magnitude here (Micron: 2,847 posted, 79 in India).
- {name: Micron, ats: workday, token: "micron|wd1|External", category: gcc, priority: 1}   # india=79
- {name: PayPal, ats: workday, token: "paypal|wd1|jobs",     category: gcc, priority: 2}   # india=8
- {name: Visa,   ats: workday, token: "visa|wd5|Visa",       category: gcc, priority: 2}   # india=2
#
# Found but NOT added:
#   nvidia|wd5|NvidiaExternalCareerSite — tenant is live with ~2,000 postings,
#     but the adapter's country facet returns 0 for India. NVIDIA does hire in
#     Bengaluru and Pune, so this is an adapter/facet mismatch rather than an
#     empty board. Worth resolving; do not re-guess the tenant, it is correct.
#   qualcomm|wd12|External — tenant resolves, board reports 0 jobs.
#   mastercard, autodesk, broadcom, hpe — tenant exists but the site name is not
#     guessable; read it off the careers page URL to finish these.
