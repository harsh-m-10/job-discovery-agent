# Cloudflare Worker: second dispatcher (offset, unconditional) for .github/workflows/ingest.yml.
# See src/index.js for what it does and README.md for deploying it.
name = "job-agent-cf-standby"
main = "src/index.js"
compatibility_date = "2026-09-01"

# No route, no custom domain and no workers.dev URL: the Worker only runs on
# its cron, so it has no public surface at all.
workers_dev = false

[triggers]
# Offset 7 minutes from cron-job.org (:00/:15/:30/:45). Free plan: 5 cron
# triggers per account; this uses one.
crons = ["7,22,37,52 * * * *"]

[observability]
enabled = true
