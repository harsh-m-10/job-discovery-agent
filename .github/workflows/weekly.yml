name: weekly

# The Sunday report (docs/PLAN.md 9.1): interviews per 10 applications first,
# then cadence, latency, pings, the funnel, referrals and scoring health -- all
# read from what the pipeline recorded. notify/weekly.py.

on:
  # Dispatched by the Cloudflare Worker's hourly cron at Sundays 03:41 UTC (09:11 IST)
  # (infra/cf-standby/src/index.js hourlyTargets). No GitHub schedule: it was
  # measured skipping this repo's scheduled runs, and with two triggers the
  # email could arrive twice.
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send the weekly report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python -m notify.weekly
