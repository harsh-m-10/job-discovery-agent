name: aggregate

# Indeed, hourly, through python-jobspy (docs/PLAN.md 6.7, decided 2026-10-15).
# No login, country India, a few search terms at results_wanted 15 -- see
# config/settings.yaml:aggregator. Writes jobs tagged source=indeed; the next
# 15-minute ingest run scores and pings them like any other job.
# Never closes a posting on absence (ingest/aggregate.py).

on:
  schedule:
    # :41 past each hour, clear of the :00/:07 ingest dispatches.
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  indeed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-aggregate.txt

      - run: pip install -r requirements-aggregate.txt

      - name: Indeed via python-jobspy
        run: python -m ingest.aggregate --indeed
