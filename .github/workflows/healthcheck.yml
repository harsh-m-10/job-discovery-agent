name: healthcheck

on:
  schedule:
    # Once a day, deliberately off the hour to avoid the scheduler's busiest
    # minute. Model names rot on a scale of weeks — vendors retire and rename
    # them with little notice — so provider health is a daily question, not a
    # per-ingest one.
    #
    # This used to run inside ingest.yml on every 15-minute tick, where it took
    # 167s of a ~395s run: 42% of the entire Actions budget spent asking eight
    # vendors whether their models still existed. Splitting it out is the single
    # largest saving available, and costs nothing in detection latency that
    # matters at this cadence.
    - cron: "41 3 * * *"
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Materialise the candidate profile
        # The deep check scores a fixture posting with the real prompt, which
        # is built from the profile. Same handling as ingest.yml: written to
        # the runner temp dir, outside the working tree; only its size printed.
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
        run: |
          if [ -z "$CANDIDATE_PROFILE_B64" ]; then
            echo "::error::CANDIDATE_PROFILE_B64 is not set — the deep check cannot run"
            exit 1
          fi
          printf '%s' "$CANDIDATE_PROFILE_B64" | base64 -d \
            > "$RUNNER_TEMP/candidate_profile.yaml"
          echo "CANDIDATE_PROFILE_PATH=$RUNNER_TEMP/candidate_profile.yaml" \
            >> "$GITHUB_ENV"
          echo "profile: $(wc -c < "$RUNNER_TEMP/candidate_profile.yaml") bytes"

      - name: Score a fixture posting with every configured provider
        # --deep makes a real scoring call per provider through the same parser
        # a run uses (PLAN 7.5). A ping is not enough: on 2026-10-15 five
        # providers answered the ping and only two could actually score -- the
        # reasoning models were out of output budget before they answered.
        # A failure turns the run red; GitHub's failure notification is the alert.
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m score.healthcheck --deep
