name: ingest
# Shown in the Actions list, so which trigger fired each run is visible there.
run-name: ingest (${{ inputs.source || 'schedule' }})

on:
  # Four triggers, on purpose (decided 2026-10-15). The concurrency group below
  # plus the 8-minute run lease in ingest/run.py collapse the duplicates, and
  # every fire -- collapsed or not -- lands in trigger_log (migration 0016).
  #   cronjob      cron-job.org, primary, every 15 min at :00/:15/:30/:45
  #   cf           Cloudflare Worker, every 15 min at :07/:22/:37/:52,
  #                unconditional (infra/cf-standby)
  #   apps-script  Apps Script standby, only when the newest run is >25 min old
  #   schedule     GitHub's own scheduler, below; tertiary
  # Dispatch starts in seconds -- measured 11s -- where `schedule` was measured
  # at a 302-minute median interval against its declared 15.
  workflow_dispatch:
    inputs:
      source:
        description: "Which trigger fired this run (cronjob | cf | apps-script | manual)"
        required: false
        default: "manual"

  # TERTIARY trigger: GitHub's own scheduler, kept only as a last resort. It is
  # best-effort and was measured at a 302-minute median interval, and GitHub
  # disables it outright after 60 days of repo inactivity, so nothing depends
  # on it. Minutes are off the quarter-hour because :00 is when it drops runs
  # hardest. The run lease in ingest/run.py stops it double-polling when a
  # dispatch has just run.
  #
  # Affordable only because this repository is public: private repos bill
  # against a 2,000 min/month allowance, which a 15-minute schedule exhausted
  # in nine days. Public repos get unmetered Actions minutes.
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  # A delayed run must never overlap the next one — two workers diffing the same
  # board could close jobs the other just inserted.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Full runs take 2-8 minutes (measured over the last 12). 14 keeps a stuck
    # run from holding the concurrency lane past the next 15-minute dispatch;
    # the per-board budget in the Workday adapter keeps one slow tenant from
    # being the thing that gets it there.
    timeout-minutes: 14
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll boards
        # The source goes through an env var rather than being interpolated
        # into the script, so a dispatch input can never be executed as shell.
        # ingest.run also restricts it to a closed set of values.
        env:
          TRIGGER_SOURCE: ${{ inputs.source || 'schedule' }}
        run: python -m ingest.run --source "$TRIGGER_SOURCE"

      - name: Materialise the candidate profile
        # The profile is not in this repository — it carries compensation and
        # employer facts and the repo is public. It arrives as a secret and is
        # written to the runner temp dir, outside the working tree, so that no
        # step can accidentally commit it. Only the byte count is ever printed.
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
        run: |
          if [ -z "$CANDIDATE_PROFILE_B64" ]; then
            echo "::error::CANDIDATE_PROFILE_B64 is not set — scoring cannot run"
            exit 1
          fi
          printf '%s' "$CANDIDATE_PROFILE_B64" | base64 -d \
            > "$RUNNER_TEMP/candidate_profile.yaml"
          echo "CANDIDATE_PROFILE_PATH=$RUNNER_TEMP/candidate_profile.yaml" \
            >> "$GITHUB_ENV"
          echo "profile: $(wc -c < "$RUNNER_TEMP/candidate_profile.yaml") bytes"

      - name: Score new postings
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m score.run

      - name: Notify
        # Runs even if scoring failed (PLAN non-negotiable 3): jobs scored by
        # an earlier run, or provisionally by the rules fallback, must still be
        # pinged. Before this, a scoring failure skipped Notify, so an LLM
        # outage silenced every ping.
        if: ${{ !cancelled() }}
        # notify/email.py picks Resend if RESEND_API_KEY is set and falls back
        # to SMTP otherwise. The SMTP_* vars were missing from this step while
        # the watchdog had them, so with no Resend key configured every ping
        # died as "no email transport configured" — the pipeline ran, scored,
        # and then dropped its only output on the floor.
        env:
          # Instant channels (notify/instant.py): an ntfy push and an email from
          # Resend's non-Gmail sender for every match. Without RESEND_API_KEY
          # the match email falls back to the SMTP path below.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python -m notify.run

      - name: Process outcome emails
        # Classifies and matches emails posted by apps_script/outcomes.gs and
        # updates application status (docs/PLAN.md 4.3). Cheap when there is
        # nothing pending; tolerates the table not existing. Independent of
        # ingest and scoring, so it runs whatever happened to them.
        if: ${{ !cancelled() }}
        run: python -m outcomes.run

      - name: Watchdog
        # Runs even when an earlier step failed — a failed run is precisely
        # when the alert matters most. Silent death is the main long-term risk.
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Checked for 401s and expiry; see notify/token_watch.py.
          GH_DISPATCH_PAT: ${{ secrets.GH_DISPATCH_PAT }}
        run: python -m notify.watchdog

      # --- external dead-man's switch ---------------------------------------
      # Both steps are the last thing in the job and neither can fail it:
      # notify.heartbeat always exits 0. See notify/heartbeat.py for why the
      # absence of this ping is the only alert that survives the workflow
      # simply never being triggered.

      - name: Heartbeat (success)
        if: success()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: python -m notify.heartbeat --ok

      - name: Heartbeat (failure)
        if: failure()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          python -m notify.heartbeat --fail --detail \
            "run ${GITHUB_RUN_ID} failed on ${GITHUB_REF_NAME}; see ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
