name: ingest

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort: runs drift by 10-20
    # minutes under load and are sometimes skipped outright — the measured gap
    # on this repo averages ~53 min. Every run re-fetches whole boards and
    # diffs, so a missed tick costs latency, never data.
    #
    # Affordable only because this repository is public: private repos bill
    # against a 2,000 min/month allowance, which this schedule exhausted in
    # nine days. Public repos get unmetered Actions minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # A delayed run must never overlap the next one — two workers diffing the same
  # board could close jobs the other just inserted.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll boards
        run: python -m ingest.run

      - name: Materialise the candidate profile
        # The profile is not in this repository — it carries compensation and
        # employer facts and the repo is public. It arrives as a secret and is
        # written to the runner temp dir, outside the working tree, so that no
        # step can accidentally commit it. Only the byte count is ever printed.
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
        run: |
          if [ -z "$CANDIDATE_PROFILE_B64" ]; then
            echo "::error::CANDIDATE_PROFILE_B64 is not set — scoring cannot run"
            exit 1
          fi
          printf '%s' "$CANDIDATE_PROFILE_B64" | base64 -d \
            > "$RUNNER_TEMP/candidate_profile.yaml"
          echo "CANDIDATE_PROFILE_PATH=$RUNNER_TEMP/candidate_profile.yaml" \
            >> "$GITHUB_ENV"
          echo "profile: $(wc -c < "$RUNNER_TEMP/candidate_profile.yaml") bytes"

      - name: Score new postings
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m score.run

      - name: Notify
        # notify/email.py picks Resend if RESEND_API_KEY is set and falls back
        # to SMTP otherwise. The SMTP_* vars were missing from this step while
        # the watchdog had them, so with no Resend key configured every ping
        # died as "no email transport configured" — the pipeline ran, scored,
        # and then dropped its only output on the floor.
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python -m notify.run

      - name: Watchdog
        # Runs even when an earlier step failed — a failed run is precisely
        # when the alert matters most. Silent death is the main long-term risk.
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m notify.watchdog
