name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lifecycle and normalization tests
        run: python tests/test_lifecycle.py

      - name: Prefilter tests
        run: python tests/test_prefilter.py

      - name: Materialise the candidate profile
        # Optional on purpose. Pull requests from forks receive no secrets, so
        # there the compensation-leak assertions skip instead of failing. On
        # this repository's own pushes the secret is present and those
        # assertions actually run — they are the reason the suite exists.
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
        run: |
          if [ -n "$CANDIDATE_PROFILE_B64" ]; then
            printf '%s' "$CANDIDATE_PROFILE_B64" | base64 -d \
              > "$RUNNER_TEMP/candidate_profile.yaml"
            echo "CANDIDATE_PROFILE_PATH=$RUNNER_TEMP/candidate_profile.yaml" \
              >> "$GITHUB_ENV"
            echo "profile present: compensation assertions will run"
          else
            echo "no profile secret: compensation assertions will skip"
          fi

      - name: Scoring transport tests
        run: python tests/test_llm.py

      - name: Referral matching tests
        run: python tests/test_referral.py

      - name: Layer boundary and banned-platform check
        run: python scripts/check_boundaries.py

      - name: Ingestion smoke test (live boards, no database)
        run: python -m ingest.run --dry-run
