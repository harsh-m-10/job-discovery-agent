name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lifecycle and normalization tests
        run: python tests/test_lifecycle.py

      - name: Prefilter tests
        run: python tests/test_prefilter.py

      - name: Materialise the candidate profile
        # Optional on purpose. Pull requests from forks receive no secrets, so
        # there the compensation-leak assertions skip instead of failing. On
        # this repository's own pushes the secret is present and those
        # assertions actually run — they are the reason the suite exists.
        env:
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
        run: |
          if [ -n "$CANDIDATE_PROFILE_B64" ]; then
            printf '%s' "$CANDIDATE_PROFILE_B64" | base64 -d \
              > "$RUNNER_TEMP/candidate_profile.yaml"
            echo "CANDIDATE_PROFILE_PATH=$RUNNER_TEMP/candidate_profile.yaml" \
              >> "$GITHUB_ENV"
            echo "profile present: compensation assertions will run"
          else
            echo "no profile secret: compensation assertions will skip"
          fi

      - name: Scoring transport tests
        run: python tests/test_llm.py

      - name: Referral matching tests
        run: python tests/test_referral.py

      - name: Alert cooldown tests
        run: python tests/test_alerts.py

      - name: Workday facet and truncation tests
        run: python tests/test_workday.py

      - name: Store and run_log telemetry tests
        run: python tests/test_store.py

      - name: Heartbeat tests
        run: python tests/test_heartbeat.py

      - name: India location gate tests
        run: python tests/test_geo.py

      - name: Notify paging and retention tests
        run: python tests/test_retention.py

      - name: Digest rendering tests
        run: python tests/test_digest.py

      - name: Dispatch token expiry tests
        run: python tests/test_token_watch.py

      - name: Instant channels (ntfy + match email) and routing tests
        run: python tests/test_instant.py

      - name: Role family classifier tests
        run: python tests/test_role.py

      - name: Outcome capture tests
        run: python tests/test_outcomes.py

      - name: SmartRecruiters adapter tests
        run: python tests/test_smartrecruiters.py

      - name: SuccessFactors adapter tests
        run: python tests/test_successfactors.py

      - name: Stable paging tests
        run: python tests/test_paging.py

      - name: LLM resilience tests (rules fallback, circuit breaker, chaos switch)
        run: python tests/test_resilience.py

      - name: Weekly report tests
        run: python tests/test_weekly.py

      - name: Daily digest tests
        run: python tests/test_daily.py

      - name: Job-alert email parser tests
        run: python tests/test_alert_parse.py

      - name: Aggregator (Indeed + alert email) planning tests
        run: python tests/test_aggregate.py

      - name: Cloudflare standby dispatcher tests
        # Node is preinstalled on ubuntu-latest; node:test needs no packages.
        run: node --test infra/cf-standby/src/index.test.mjs

      - name: Dashboard settings match config/settings.yaml
        # The dashboard's thresholds are generated from the YAML (PLAN 8.2);
        # a stale generated file would let the queue and the pings disagree.
        run: python scripts/gen_dashboard_settings.py --check

      - name: Layer boundary and banned-platform check
        run: python scripts/check_boundaries.py

      - name: Ingestion smoke test (live boards, no database)
        run: python -m ingest.run --dry-run

  # The nightly backup's whole cycle, against throwaway databases, on every
  # push: every migration applied to an empty Postgres 17, synthetic rows in
  # every table, dump -> restore -> count check -> value-exact check, and an
  # age encrypt/decrypt round trip with a key generated for this run. Needs no
  # secret, so the backup path is tested long before it is configured, and a
  # migration that breaks restore fails here rather than at 02:11 some night.
  backup-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: scratch
      PGCLIENTENCODING: UTF8
    steps:
      - uses: actions/checkout@v4

      - name: Install pg 17 client and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "psycopg2-binary>=2.9.9"

      - name: Every migration, in order, onto an empty database
        run: |
          createdb source && createdb target
          for f in db/migrations/*.sql tests/fixtures/backup_seed.sql; do
            echo "applying $f"
            psql -d source -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Dump, restore, verify counts and values
        env:
          BACKUP_SOURCE_URL: postgresql://postgres:scratch@localhost:5432/source
        run: |
          python scripts/backup.py dump --out t.dump --counts t.counts.json
          python scripts/backup.py restore --dump t.dump --counts t.counts.json \
            --target postgresql://postgres:scratch@localhost:5432/target
          python tests/fixtures/check_backup_roundtrip.py \
            postgresql://postgres:scratch@localhost:5432/target

      - name: age encrypt/decrypt round trip
        run: |
          age-keygen -o throwaway.key 2>/dev/null
          age-keygen -y throwaway.key > recipient.txt
          age -R recipient.txt -o t.dump.age t.dump
          age -d -i throwaway.key -o t.decrypted t.dump.age
          cmp t.dump t.decrypted && echo "decrypted dump is byte-identical"
