name: keepalive

# GitHub disables scheduled workflows after 60 days without repository activity,
# and workflow runs do not count as activity — only commits do. Without this the
# ingestion cron silently stops two months after the last push.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat and push
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
