name: probe

# One-off reachability check from a GitHub Actions runner (decided 2026-10-16:
# "probe Naukri's public search once from Actions and report the status").
# The URL arrives as a dispatch input so no third-party host is written into
# the repository; it is passed through an env var, never interpolated into
# the script. Prints status, content type and the first bytes only. Manual
# dispatch only; it never runs on a schedule.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to GET once"
        required: true
      headers:
        description: "Extra headers, one 'Name: value' per line (optional)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET once
        env:
          URL: ${{ inputs.url }}
          HEADERS: ${{ inputs.headers }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Chrome/140.0 Safari/537.36"})
          for line in os.environ.get("HEADERS", "").splitlines():
              if ":" in line:
                  k, v = line.split(":", 1); req.add_header(k.strip(), v.strip())
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read(400)
                  print("status", r.status, "|", r.headers.get("content-type")); print(body[:400])
          except urllib.error.HTTPError as e:
              print("status", e.code, "|", e.headers.get("content-type")); print(e.read(400))
          except Exception as e:
              print("error", type(e).__name__, e)
          PY
