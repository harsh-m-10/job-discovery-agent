ping_threshold: 6.5
max_pings_per_day: 40
poll_interval_minutes: 15
max_experience_years: 4

# ---------------------------------------------------------------------------
# Age ceiling, enforced in the prefilter so a stale req never reaches a paid
# call. Age is the ATS posting date, falling back to first_seen_at when the
# board publishes none.
#
# Measured 2026-09-04 over 1,591 open jobs: only 187 were 5 days old or less,
# and of the 170 that had reached the LLM, 143 were older than 5 days. So this
# is the single biggest lever on spend — but most of that backlog is an
# artefact of adding 52 boards that day, whose whole back catalogue arrived at
# once. In steady state, ingest runs every 15 minutes and genuinely new
# postings are seen within hours, so this gate should rarely bite.
#
# The cost is real and worth knowing: applied to that day's queue it would also
# have dropped 51 of 61 jobs above threshold, including a 7-day-old 9.5. Raise
# it if good matches start disappearing; 0 disables the gate entirely.
#
# When adding a new board, score its first run with --max-age-days 0, or its
# entire existing catalogue is discarded unscored.
max_age_days: 3

# Wider ceiling for *showing* and *pinging* a job that was already scored.
#
# These are deliberately not the same number. Scoring is gated at 3 days so a
# stale req never costs an LLM call; but scoring is not instantaneous — a run
# can be delayed by GitHub's scheduler (measured average gap ~53 min, sometimes
# skipped outright) or by a provider backing off. A job admitted at 2.9 days
# would then be dropped by the notifier before it was ever delivered, which is
# the one failure this system cannot afford: the job was paid for and judged a
# match, and then silently discarded.
#
# The 2-day gap is the slack. Anything scored inside the 3-day gate has two
# full days to be pinged and read before the display ceiling hides it.
# Must be >= max_age_days, or scored jobs become unreachable. 0 disables.
max_display_age_days: 5

# ---------------------------------------------------------------------------
# LLM providers, tried in `priority` order. Every limit lives here — nothing is
# hardcoded in score/providers.py.
#
# Rationale for the ordering: Groq's free tier is limited per *account*, not per
# key, so a second project on the same account competes for the same budget.
# Google AI Studio is primary because its free allowance is the largest and
# independent of that account; Groq and Cerebras are fallbacks that also cover
# each other's outages.
#
# batch_size and max_chars are per provider because the binding constraint is
# tokens-per-minute, and it differs by an order of magnitude between vendors.
# A fallback with a tighter ceiling re-chunks automatically.
# ---------------------------------------------------------------------------
llm_providers:
  # Model choice measured, not assumed, on a real 5.4k-token scoring payload:
  #   gemini-flash-lite-latest   200 in  2.6s   <- chosen
  #   gemini-3-flash-preview     200 in 10.5s   <- second Google attempt
  #   gemini-flash-latest        read timeout at 76s (persistent 503s)
  #   gemini-2.0/2.5-flash       404 "no longer available" on this key
  - name: google
    priority: 1
    model: gemini-flash-lite-latest
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    rpm: 10                 # AI Studio free tier; conservative
    tpm: 250000
    # 5 not 8: a truncated reply costs the whole batch a retry, and Gemini
    # needed more output room than 320/job to close its JSON at batch 8.
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 90

  # Same vendor, different model. Slower but independent of whatever makes the
  # flash-lite endpoint wobble, so it is worth a try before leaving Google.
  - name: google-flash3
    priority: 3
    model: gemini-3-flash-preview
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    rpm: 10
    tpm: 250000
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 120

  # DISABLED at the operator's request: this Groq account is shared with a
  # separate video-generation project, and Groq's free limits are per account,
  # so the two compete for one budget. Kept configured, not deleted — flip
  # `enabled` back to true if the other project ever moves off it.
  - name: groq
    priority: 7
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 30
    tpm: 12000              # measured from x-ratelimit-limit-tokens
    batch_size: 3
    max_chars: 2000
    max_output_tokens_per_job: 320
    json_mode: true
    enabled: false

  # NOTE: this account currently answers 402 payment_required on every model,
  # including the "Preview" ones. The limits below are the published figures and
  # will apply once billing is enabled; until then the provider simply fails
  # over. Only 5 requests/minute against 30k tokens/minute means ~6k tokens per
  # request, which is what batch_size and max_chars are sized to.
  - name: cerebras
    priority: 8
    model: gpt-oss-120b
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    rpm: 5
    tpm: 30000
    batch_size: 4
    max_chars: 2000
    max_output_tokens_per_job: 320
    json_mode: true
    enabled: true

  # --- added after measuring every candidate against a real 8,040-token
  # payload (5 jobs). Ordered by measured latency, not by vendor reputation.
  # Rejected in that test: openrouter gemma-4-31b (429), openrouter
  # nemotron-nano-30b and open-mistral-nemo (returned unparseable JSON),
  # nvidia meta/llama-3.3-70b (read timeout at 150s), openrouter gpt-oss-20b
  # (worked but took 102s, far too slow to sit in the chain).

  # DEMOTED 2026-09-04 from priority 2. The key is valid — GET /v1/models
  # answers 200 — but every /chat/completions call returns 429 "Rate limit
  # exceeded" (code 1300) instantly, from a cold start, on any model. That is
  # the account's own free-tier gate, not our pacing: no request of ours has
  # succeeded to be limited in the first place. It stays enabled and configured
  # so it rejoins the chain the moment the account is activated, but it must not
  # sit ahead of providers that actually answer.
  - name: mistral
    priority: 6
    model: mistral-small-latest        # 4.5s, 5/5 when the account was live
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    rpm: 30
    tpm: 400000
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 90

  - name: cloudflare
    priority: 4
    model: "@cf/openai/gpt-oss-120b"   # 13.3s, 5/5
    # Cloudflare carries the account id in the path; ${VAR} is expanded from the
    # environment so it stays out of the committed config.
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key_env: CLOUDFLARE_API_KEY
    rpm: 30
    tpm: 0                             # free tier is metered in "neurons", not tokens
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 120

  - name: openrouter
    priority: 5
    model: nvidia/nemotron-3-super-120b-a12b:free   # 15.0s, 5/5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 15                            # free models are rate-limited hard
    tpm: 0
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 120

  # Model swapped 2026-09-04: openai/gpt-oss-120b now answers 410 Gone ("the
  # model has been deprecated") and the whole provider was dead. The catalogue
  # still lists openai/gpt-oss-20b, but it returns a null message content under
  # json_object mode, so it is unusable here. nemotron-3-super answered in 5.3s
  # with valid JSON — faster than the model it replaces, hence the promotion
  # from 6 to 2.
  - name: nvidia
    priority: 2
    model: nvidia/nemotron-3-super-120b-a12b   # 5.3s, valid JSON
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    rpm: 30
    tpm: 0
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 120

# Fallbacks used when a provider entry omits them, and by --batch-size/--char-limit
llm_batch_size: 4
description_char_limit: 2600

# ---------------------------------------------------------------------------
# Company size. No ATS exposes headcount, so companies.headcount_band is seeded
# by hand. Only 'micro' is penalised; 'unknown' is always neutral so an untagged
# company is never silently buried.
# ---------------------------------------------------------------------------
headcount_penalties:
  micro: -2.0      # <25 employees
  small: 0.0       # 25-100
  mid: 0.0         # 100-1000
  large: 0.0       # 1000+
  unknown: 0.0

# Layer 1 location filter. A job is kept if its location string matches any of
# these (case-insensitive substring), or if the string is empty/unknown.
location_keywords:
  - bengaluru
  - bangalore
  - karnataka
  - india
  - remote

# Board health
max_consecutive_failures: 5
fetch_timeout_seconds: 20
fetch_concurrency: 8
