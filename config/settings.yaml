ping_threshold: 6.5
max_pings_per_day: 40
# Minimum minutes between polls of one board, by company priority. 0 means
# every run. Read by ingest/run.py:is_due. This key used to be a single "15"
# that nothing read, while the real cadence was hardcoded in run.py; the values
# below are that hardcoded cadence, moved here unchanged (Phase 2.3).
#   1 = boards with >= 15 India roles: every run
#   2 = hourly (55, not 60, so a run arriving a few minutes early still polls)
#   3 = daily (23h for the same reason)
poll_interval_minutes:
  1: 0
  2: 55
  3: 1380
max_experience_years: 4

# ---------------------------------------------------------------------------
# Age ceiling, enforced in the prefilter so a stale req never reaches a paid
# call. Age is the ATS posting date, falling back to first_seen_at when the
# board publishes none.
#
# Measured 2026-09-04 over 1,591 open jobs: only 187 were 5 days old or less,
# and of the 170 that had reached the LLM, 143 were older than 5 days. So this
# is the single biggest lever on spend — but most of that backlog is an
# artefact of adding 52 boards that day, whose whole back catalogue arrived at
# once. In steady state, ingest runs every 15 minutes and genuinely new
# postings are seen within hours, so this gate should rarely bite.
#
# The cost is real and worth knowing: applied to that day's queue it would also
# have dropped 51 of 61 jobs above threshold, including a 7-day-old 9.5. Raise
# it if good matches start disappearing; 0 disables the gate entirely.
#
# When adding a new board, score its first run with --max-age-days 0, or its
# entire existing catalogue is discarded unscored.
max_age_days: 3

# Wider ceiling for *showing* and *pinging* a job that was already scored.
#
# These are deliberately not the same number. Scoring is gated at 3 days so a
# stale req never costs an LLM call; but scoring is not instantaneous — a run
# can be delayed by GitHub's scheduler (measured average gap ~53 min, sometimes
# skipped outright) or by a provider backing off. A job admitted at 2.9 days
# would then be dropped by the notifier before it was ever delivered, which is
# the one failure this system cannot afford: the job was paid for and judged a
# match, and then silently discarded.
#
# The 2-day gap is the slack. Anything scored inside the 3-day gate has two
# full days to be pinged and read before the display ceiling hides it.
# Must be >= max_age_days, or scored jobs become unreachable. 0 disables.
max_display_age_days: 5

# ---------------------------------------------------------------------------
# LLM providers, tried in `priority` order. Every limit lives here — nothing is
# hardcoded in score/providers.py.
#
# Rationale for the ordering: Groq's free tier is limited per *account*, not per
# key, so a second project on the same account competes for the same budget.
# Google AI Studio is primary because its free allowance is the largest and
# independent of that account; Groq and Cerebras are fallbacks that also cover
# each other's outages.
#
# batch_size and max_chars are per provider because the binding constraint is
# tokens-per-minute, and it differs by an order of magnitude between vendors.
# A fallback with a tighter ceiling re-chunks automatically.
# ---------------------------------------------------------------------------
llm_providers:
  # Model choice measured, not assumed, on a real 5.4k-token scoring payload:
  #   gemini-flash-lite-latest   200 in  2.6s   <- chosen
  #   gemini-3-flash-preview     200 in 10.5s   <- second Google attempt
  #   gemini-flash-latest        read timeout at 76s (persistent 503s)
  #   gemini-2.0/2.5-flash       404 "no longer available" on this key
  - name: google
    priority: 1
    model: gemini-flash-lite-latest
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    rpm: 10                 # AI Studio free tier; conservative
    tpm: 250000
    # 5 not 8: a truncated reply costs the whole batch a retry, and Gemini
    # needed more output room than 320/job to close its JSON at batch 8.
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 90

  # Same vendor, different model. Slower but independent of whatever makes the
  # flash-lite endpoint wobble, so it is worth a try before leaving Google.
  - name: google-flash3
    # Reasoning model: it spends output tokens thinking before answering, so
    # the old 500/job budget ran out first -- an empty or truncated reply on
    # every real scoring call, while the healthcheck ping still said "live".
    # Found by `score.healthcheck --deep` on 2026-10-15; these values were
    # measured to score a fixture batch correctly. The output ceiling is
    # min(4096, per_job x batch + 200), hence the small batch.
    priority: 3
    model: gemini-3-flash-preview
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    rpm: 10
    tpm: 250000
    batch_size: 3
    max_chars: 4000
    max_output_tokens_per_job: 1200
    json_mode: true
    enabled: true
    timeout: 120

  # DISABLED at the operator's request: this Groq account is shared with a
  # separate video-generation project, and Groq's free limits are per account,
  # so the two compete for one budget. Kept configured, not deleted — flip
  # `enabled` back to true if the other project ever moves off it.
  - name: groq
    priority: 7
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 30
    tpm: 12000              # measured from x-ratelimit-limit-tokens
    batch_size: 3
    max_chars: 2000
    max_output_tokens_per_job: 320
    json_mode: true
    enabled: false

  # NOTE: this account currently answers 402 payment_required on every model,
  # including the "Preview" ones. The limits below are the published figures and
  # will apply once billing is enabled; until then the provider simply fails
  # over. Only 5 requests/minute against 30k tokens/minute means ~6k tokens per
  # request, which is what batch_size and max_chars are sized to.
  - name: cerebras
    priority: 8
    model: gpt-oss-120b
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    rpm: 5
    tpm: 30000
    batch_size: 4
    max_chars: 2000
    max_output_tokens_per_job: 320
    json_mode: true
    enabled: true

  # --- added after measuring every candidate against a real 8,040-token
  # payload (5 jobs). Ordered by measured latency, not by vendor reputation.
  # Rejected in that test: openrouter gemma-4-31b (429), openrouter
  # nemotron-nano-30b and open-mistral-nemo (returned unparseable JSON),
  # nvidia meta/llama-3.3-70b (read timeout at 150s), openrouter gpt-oss-20b
  # (worked but took 102s, far too slow to sit in the chain).

  # DEMOTED 2026-09-04 from priority 2. The key is valid — GET /v1/models
  # answers 200 — but every /chat/completions call returns 429 "Rate limit
  # exceeded" (code 1300) instantly, from a cold start, on any model. That is
  # the account's own free-tier gate, not our pacing: no request of ours has
  # succeeded to be limited in the first place. It stays enabled and configured
  # so it rejoins the chain the moment the account is activated, but it must not
  # sit ahead of providers that actually answer.
  - name: mistral
    priority: 6
    model: mistral-small-latest        # 4.5s, 5/5 when the account was live
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    rpm: 30
    tpm: 400000
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 90

  - name: cloudflare
    priority: 4
    model: "@cf/openai/gpt-oss-120b"   # 13.3s, 5/5
    # Cloudflare carries the account id in the path; ${VAR} is expanded from the
    # environment so it stays out of the committed config.
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key_env: CLOUDFLARE_API_KEY
    rpm: 30
    tpm: 0                             # free tier is metered in "neurons", not tokens
    batch_size: 5
    max_chars: 4000
    max_output_tokens_per_job: 500
    json_mode: true
    enabled: true
    timeout: 120

  - name: openrouter
    # Reasoning model: it spends output tokens thinking before answering, so
    # the old 500/job budget ran out first -- an empty or truncated reply on
    # every real scoring call, while the healthcheck ping still said "live".
    # Found by `score.healthcheck --deep` on 2026-10-15; these values were
    # measured to score a fixture batch correctly. Same model as
    # `nvidia`; its thinking length varies, so it gets the same budget. The output ceiling is
    # min(4096, per_job x batch + 200), hence the small batch.
    priority: 5
    model: nvidia/nemotron-3-super-120b-a12b:free   # 15.0s, 5/5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 15                            # free models are rate-limited hard
    tpm: 0
    batch_size: 1
    max_chars: 4000
    max_output_tokens_per_job: 2500
    json_mode: true
    enabled: true
    timeout: 120

  # Model swapped 2026-09-04: openai/gpt-oss-120b now answers 410 Gone ("the
  # model has been deprecated") and the whole provider was dead. The catalogue
  # still lists openai/gpt-oss-20b, but it returns a null message content under
  # json_object mode, so it is unusable here. nemotron-3-super answered in 5.3s
  # with valid JSON — faster than the model it replaces, hence the promotion
  # from 6 to 2.
  - name: nvidia
    # Reasoning model: it spends output tokens thinking before answering, so
    # the old 500/job budget ran out first -- an empty or truncated reply on
    # every real scoring call, while the healthcheck ping still said "live".
    # Found by `score.healthcheck --deep` on 2026-10-15; these values were
    # measured to score a fixture batch correctly. The output ceiling is
    # min(4096, per_job x batch + 200), hence the small batch.
    priority: 2
    model: nvidia/nemotron-3-super-120b-a12b   # 5.3s, valid JSON
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    rpm: 30
    tpm: 0
    batch_size: 1
    max_chars: 4000
    max_output_tokens_per_job: 2500
    json_mode: true
    enabled: true
    timeout: 120

# Fallbacks used when a provider entry omits them, and by --batch-size/--char-limit
llm_batch_size: 4
description_char_limit: 2600

# ---------------------------------------------------------------------------
# Company size. No ATS exposes headcount, so companies.headcount_band is seeded
# by hand. Only 'micro' is penalised; 'unknown' is always neutral so an untagged
# company is never silently buried.
# ---------------------------------------------------------------------------
headcount_penalties:
  micro: -2.0      # <25 employees
  small: 0.0       # 25-100
  mid: 0.0         # 100-1000
  large: 0.0       # 1000+
  unknown: 0.0

# Layer 1 location filter — the single vocabulary for "is this in India?",
# compiled by common/geo.py and used by the ingest gate, the Workday facet
# picker and scripts/verify_boards.py alike.
#
# Matched as WHOLE WORDS, case-insensitively, not substrings. That is what keeps
# "India" out of "Indiana" and "Indianapolis" (232 postings on Target's state
# facet alone). Two consequences worth knowing before editing:
#
#   * Never add the bare country code "in". Case-insensitively it matches the
#     English word "in" and would admit every remote-US posting in the corpus.
#   * "remote" does NOT belong here, though it used to. Remote is handled
#     separately in common/geo.py, which requires a remote posting to ALSO name
#     India somewhere; bare "Remote" is overwhelmingly Remote-US, and listing it
#     as an India keyword would have let all of it through.
#
# Measured 2026-10-15 across all 120 verified boards fetched with no filter
# (14,294 postings, of which the gate kept 2,264), widening this list recovered
# 17 postings: Delhi 10, Lucknow 6, Kolkata 1. Delhi was the real bug — the list
# carried the NCR satellites Gurgaon, Gurugram and Noida but not the city they
# orbit. Everything below the "no current postings" marker recovered nothing on
# today's roster and is cheap insurance for the India-HQ employers Phase 6 adds.
location_keywords:
  # country and the metros that actually appear in the corpus today
  - india
  - bengaluru
  - bangalore
  - hyderabad
  - pune
  - chennai
  - mumbai
  - delhi
  - new delhi
  - noida
  - gurgaon
  - gurugram
  - kolkata
  - lucknow
  # states seen in location strings
  - karnataka
  - telangana
  - tamil nadu
  - maharashtra
  - haryana
  # --- no current postings: insurance for Phase 6 ---
  - ahmedabad
  - coimbatore
  - thiruvananthapuram
  - trivandrum
  - kochi
  - cochin
  - ernakulam
  - indore
  - nagpur
  - jaipur
  - bhubaneswar
  - vadodara
  - baroda
  - mysuru
  - mysore
  - chandigarh
  - surat
  - visakhapatnam
  - nashik
  - thane
  - navi mumbai
  - kerala
  - gujarat
  - west bengal
  - rajasthan
  - odisha
  - andhra pradesh
  - madhya pradesh
  - uttar pradesh

# Resume variant per role family (Phase 3.3). Each instant ping names the
# variant to send, so applying from the phone does not start with "which CV?".
# Families come from common/role.py. Fill in a link you maintain (a Drive
# file, say); a family left empty simply gets no "Resume:" line. Several
# families can share one link.
resume_variants:
  genai: ""
  ml: ""
  data: ""
  backend: ""
  platform: ""
  fullstack: ""
  security: ""

# Run lease (Phase 2.2). From Phase 2 the pipeline has three triggers that can
# fire close together -- the cron-job.org dispatch, the Cloudflare standby, and
# GitHub's own schedule. ingest.run exits early when an automated run finished
# successfully and started less than this many minutes ago, so back-to-back
# triggers cost one poll, not two. Manual runs (--source manual, or --only)
# neither honour the lease nor count toward it.
run_lease_minutes: 8

# notify/run.py deletes `notifications` rows with ok = false older than this
# on every run. Rows with ok = true are never deleted: they are the per-job
# dedupe record, and removing one would re-ping its job.
notification_failure_retention_days: 15

# Board health
max_consecutive_failures: 5
fetch_timeout_seconds: 20
fetch_concurrency: 8

# Warmth for referral ranking (PLAN 5.3; decided 2026-10-15). The LinkedIn
# export carries no education, so a connection's year is the only signal:
# connected during the RNSIT batch years -> batchmate, within one year either
# side -> near-batch. Applied at import and by scripts/flag_batchmates.py.
# Measured at decision time: 937 of 1,118 connections fall inside 2021-2025, so
# the flag ranks warm over cold rather than picking out a few people.
referral_warmth:
  batch_years: [2021, 2025]
  near_batch_years: [2020, 2026]

# Sources that are not ATS boards (PLAN 6.7; decided 2026-10-15). See
# ingest/aggregate.py. Indeed is searched hourly through python-jobspy with no
# login; volume is kept low on purpose (terms x results_wanted per hour).
# Job-alert emails need no settings here: forward them to the Gmail label
# job/alerts and apps_script/outcomes.gs does the rest. Neither source is ever
# closed on absence -- only after ttl_days without a sighting.
aggregator:
  ttl_days: 21
  indeed:
    enabled: true
    # Bengaluru only (decided 2026-10-16). Terms follow the resume's role
    # families: backend/platform (Python services, Kubernetes), GenAI (LLM
    # integration, agents, RAG), ML (pipelines), data (PySpark).
    location: Bengaluru, Karnataka
    hours_old: 2
    results_wanted: 15
    pause_seconds: 4
    search_terms:
      - python backend engineer
      - backend engineer
      - platform engineer
      - software engineer python
      - generative ai engineer
      - llm engineer
      - ai engineer agents
      - machine learning engineer
      - data engineer pyspark
      - data engineer

# Database retention (db/migrations/0025, scripts/prune.py; decided 2026-10-16).
# Nightly, after the backup: closed postings older than this are deleted, or
# stripped of their description if you were pinged about, applied to or asked
# a referral for them. Processed alert mail and failed notifications go too.
retention_days: 15
